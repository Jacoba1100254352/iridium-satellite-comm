; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
;monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
check_skip_packages = yes

; Underclock the RP2040 to reduce idle/active power draw (adjust to taste).
; Arduino-Pico documents board_build.f_cpu for PlatformIO.  [oai_citation:6‡Arduino-Pico](https://arduino-pico.readthedocs.io/en/latest/platformio.html)
board_build.f_cpu = 48000000L

[env:adafruit_kb2040]
board = adafruit_kb2040
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.15.2
	sparkfun/IridiumSBDi2c @ ^3.0.8
	sparkfun/SparkFun u-blox GNSS v3 @ ^3.0.16
